name: Build and Push Docker Images on PR Label

on:
  pull_request:
    types: [labeled]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [db, web, words]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
         docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:latest \
          -f ${{ matrix.service }}/Dockerfile \
          ${{ matrix.service }}

      - name: Tag and push images
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:latest ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:${{ github.run_number }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:latest ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wordsmith-${{ matrix.service }}:${{ github.sha }}
